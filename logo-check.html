<!DOCTYPE html>
<html>
<head>
    <title>Logo Comparison</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 40px; text-align: center; }
        .row { display: flex; justify-content: center; align-items: center; gap: 60px; margin: 40px 0; }
        .item { text-align: center; }
        .item p { margin-top: 10px; color: #666; font-size: 14px; }
        .dark-bg { background: #0a2744; padding: 30px; border-radius: 12px; display: inline-block; }
        h2 { color: #333; }
        hr { border: none; border-top: 1px solid #ddd; margin: 40px 0; }
    </style>
</head>
<body>
    <h1>Logo Comparison</h1>

    <h2>Original (JPG)</h2>
    <div class="row">
        <div class="item">
            <img src="../Downloads/Kerri logo.jpg" width="150" height="150" style="object-fit:contain;">
            <p>Original JPG</p>
        </div>
        <div class="item">
            <img src="images/kerri-logo.svg" width="150" height="150">
            <p>New SVG Recreation</p>
        </div>
    </div>

    <hr>

    <h2>Different Sizes</h2>
    <div class="row">
        <div class="item">
            <img src="images/kerri-logo.svg" width="32" height="32">
            <p>32px (favicon)</p>
        </div>
        <div class="item">
            <img src="images/kerri-logo.svg" width="48" height="48">
            <p>48px (navbar)</p>
        </div>
        <div class="item">
            <img src="images/kerri-logo.svg" width="80" height="80">
            <p>80px (medium)</p>
        </div>
        <div class="item">
            <img src="images/kerri-logo.svg" width="150" height="150">
            <p>150px (large)</p>
        </div>
    </div>

    <hr>

    <h2>On Dark Background</h2>
    <div class="dark-bg">
        <div class="row" style="margin:0;">
            <div class="item">
                <img src="images/kerri-logo.svg" width="48" height="48" style="filter: brightness(0) invert(1);">
                <p style="color:rgba(255,255,255,0.5);">White version</p>
            </div>
            <div class="item">
                <img src="images/kerri-logo.svg" width="80" height="80" style="filter: brightness(0) invert(1);">
                <p style="color:rgba(255,255,255,0.5);">White version</p>
            </div>
        </div>
    </div>
</body>
</html>
